name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build native app
        run: ./build.sh
      - name: Run synthetic tests
        run: ./test.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict 'Chat Harvest.app'
